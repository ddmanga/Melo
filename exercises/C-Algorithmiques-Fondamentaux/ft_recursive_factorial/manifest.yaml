name: ft_recursive_factorial
tags: ["piscine", "ex1", "arithmetique"]

sources:
  - ft_recursive_factorial.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "factorielle de 0 vaut 1"
    main: |
      #include <stdio.h>
      int ft_recursive_factorial(int nb);
      int main(void)
      {
          int res = ft_recursive_factorial(0);
          if (res != 1)
          {
              printf("ft_recursive_factorial(0) = %d, attendu 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "factorielle de 1 vaut 1"
    main: |
      #include <stdio.h>
      int ft_recursive_factorial(int nb);
      int main(void)
      {
          int res = ft_recursive_factorial(1);
          if (res != 1)
          {
              printf("ft_recursive_factorial(1) = %d, attendu 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "factorielle de 2 vaut 2"
    main: |
      #include <stdio.h>
      int ft_recursive_factorial(int nb);
      int main(void)
      {
          int res = ft_recursive_factorial(2);
          if (res != 2)
          {
              printf("ft_recursive_factorial(2) = %d, attendu 2\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "factorielle de 5 vaut 120"
    main: |
      #include <stdio.h>
      int ft_recursive_factorial(int nb);
      int main(void)
      {
          int res = ft_recursive_factorial(5);
          if (res != 120)
          {
              printf("ft_recursive_factorial(5) = %d, attendu 120\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "factorielle de 10 vaut 3628800"
    main: |
      #include <stdio.h>
      int ft_recursive_factorial(int nb);
      int main(void)
      {
          int res = ft_recursive_factorial(10);
          if (res != 3628800)
          {
              printf("ft_recursive_factorial(10) = %d, attendu 3628800\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "factorielle de 12 (plus grande valeur sans overflow sur un int)"
    # 12! = 479001600, rentre dans un int (max 2147483647).
    # 13! depasse deja INT_MAX, non teste car l'overflow n'est pas a gerer.
    main: |
      #include <stdio.h>
      int ft_recursive_factorial(int nb);
      int main(void)
      {
          int res = ft_recursive_factorial(12);
          if (res != 479001600)
          {
              printf("ft_recursive_factorial(12) = %d, attendu 479001600\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "argument invalide : -1 retourne 0"
    main: |
      #include <stdio.h>
      int ft_recursive_factorial(int nb);
      int main(void)
      {
          int res = ft_recursive_factorial(-1);
          if (res != 0)
          {
              printf("ft_recursive_factorial(-1) = %d, attendu 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "argument invalide : nombre negatif quelconque retourne 0"
    main: |
      #include <stdio.h>
      int ft_recursive_factorial(int nb);
      int main(void)
      {
          int res = ft_recursive_factorial(-42);
          if (res != 0)
          {
              printf("ft_recursive_factorial(-42) = %d, attendu 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "pas de stack overflow sur un negatif eloigne de 0"
    # Piege specifique a la version RECURSIVE : une fonction qui ne teste
    # "nb < 0" qu'une fois avant de rappeler ft_recursive_factorial(nb - 1)
    # sans jamais revalider l'invalidite peut recurser des millions de fois
    # avant de planter en stack overflow, au lieu de retourner 0 immediatement
    # des le premier appel invalide.
    main: |
      #include <stdio.h>
      #include <limits.h>
      int ft_recursive_factorial(int nb);
      int main(void)
      {
          int res = ft_recursive_factorial(INT_MIN + 1);
          if (res != 0)
          {
              printf("ft_recursive_factorial(INT_MIN + 1) = %d, attendu 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
    check_memory: false