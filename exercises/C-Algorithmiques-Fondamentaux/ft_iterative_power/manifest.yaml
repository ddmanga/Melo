name: ft_iterative_power
tags: ["piscine", "ex2", "arithmetique"]

sources:
  - ft_iterative_power.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "cas special : 0 puissance 0 vaut 1"
    main: |
      #include <stdio.h>
      int ft_iterative_power(int nb, int power);
      int main(void)
      {
          int res = ft_iterative_power(0, 0);
          if (res != 1)
          {
              printf("ft_iterative_power(0, 0) = %d, attendu 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "n'importe quel nombre puissance 0 vaut 1"
    main: |
      #include <stdio.h>
      int ft_iterative_power(int nb, int power);
      int main(void)
      {
          int res = ft_iterative_power(5, 0);
          if (res != 1)
          {
              printf("ft_iterative_power(5, 0) = %d, attendu 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "0 puissance un nombre positif vaut 0"
    main: |
      #include <stdio.h>
      int ft_iterative_power(int nb, int power);
      int main(void)
      {
          int res = ft_iterative_power(0, 5);
          if (res != 0)
          {
              printf("ft_iterative_power(0, 5) = %d, attendu 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "puissance 1 retourne le nombre lui-meme"
    main: |
      #include <stdio.h>
      int ft_iterative_power(int nb, int power);
      int main(void)
      {
          int res = ft_iterative_power(7, 1);
          if (res != 7)
          {
              printf("ft_iterative_power(7, 1) = %d, attendu 7\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "cas simple : 2 puissance 10 vaut 1024"
    main: |
      #include <stdio.h>
      int ft_iterative_power(int nb, int power);
      int main(void)
      {
          int res = ft_iterative_power(2, 10);
          if (res != 1024)
          {
              printf("ft_iterative_power(2, 10) = %d, attendu 1024\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "base negative, puissance paire (resultat positif)"
    main: |
      #include <stdio.h>
      int ft_iterative_power(int nb, int power);
      int main(void)
      {
          int res = ft_iterative_power(-2, 4);
          if (res != 16)
          {
              printf("ft_iterative_power(-2, 4) = %d, attendu 16\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "base negative, puissance impaire (resultat negatif)"
    main: |
      #include <stdio.h>
      int ft_iterative_power(int nb, int power);
      int main(void)
      {
          int res = ft_iterative_power(-2, 3);
          if (res != -8)
          {
              printf("ft_iterative_power(-2, 3) = %d, attendu -8\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "puissance negative retourne 0 (nombre positif)"
    main: |
      #include <stdio.h>
      int ft_iterative_power(int nb, int power);
      int main(void)
      {
          int res = ft_iterative_power(5, -1);
          if (res != 0)
          {
              printf("ft_iterative_power(5, -1) = %d, attendu 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "puissance negative retourne 0 (0 puissance negative aussi)"
    # Cas limite qui combine les deux regles : 0 n'est puissance-0 special
    # QUE quand l'exposant vaut exactement 0. Ici l'exposant est negatif,
    # donc la regle "puissance negative -> 0" doit primer.
    main: |
      #include <stdio.h>
      int ft_iterative_power(int nb, int power);
      int main(void)
      {
          int res = ft_iterative_power(0, -3);
          if (res != 0)
          {
              printf("ft_iterative_power(0, -3) = %d, attendu 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "1 puissance grand nombre reste 1"
    main: |
      #include <stdio.h>
      int ft_iterative_power(int nb, int power);
      int main(void)
      {
          int res = ft_iterative_power(1, 1000);
          if (res != 1)
          {
              printf("ft_iterative_power(1, 1000) = %d, attendu 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "puissance negative de grande magnitude retourne 0 sans boucler longtemps"
    # Verifie qu'une boucle "while (power != 0) power++;" mal ecrite ne parte
    # pas dans une boucle enorme depuis un tres grand negatif.
    main: |
      #include <stdio.h>
      #include <limits.h>
      int ft_iterative_power(int nb, int power);
      int main(void)
      {
          int res = ft_iterative_power(2, INT_MIN + 1);
          if (res != 0)
          {
              printf("ft_iterative_power(2, INT_MIN + 1) = %d, attendu 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
    check_memory: false