name: ft_iterative_factorial
tags: ["piscine", "ex0", "arithmetique"]

sources:
  - ft_iterative_factorial.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "factorielle de 0 vaut 1"
    main: |
      #include <stdio.h>
      int ft_iterative_factorial(int nb);
      int main(void)
      {
          int res = ft_iterative_factorial(0);
          if (res != 1)
          {
              printf("ft_iterative_factorial(0) = %d, attendu 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "factorielle de 1 vaut 1"
    main: |
      #include <stdio.h>
      int ft_iterative_factorial(int nb);
      int main(void)
      {
          int res = ft_iterative_factorial(1);
          if (res != 1)
          {
              printf("ft_iterative_factorial(1) = %d, attendu 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "factorielle de 2 vaut 2"
    main: |
      #include <stdio.h>
      int ft_iterative_factorial(int nb);
      int main(void)
      {
          int res = ft_iterative_factorial(2);
          if (res != 2)
          {
              printf("ft_iterative_factorial(2) = %d, attendu 2\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "factorielle de 5 vaut 120"
    main: |
      #include <stdio.h>
      int ft_iterative_factorial(int nb);
      int main(void)
      {
          int res = ft_iterative_factorial(5);
          if (res != 120)
          {
              printf("ft_iterative_factorial(5) = %d, attendu 120\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "factorielle de 10 vaut 3628800"
    main: |
      #include <stdio.h>
      int ft_iterative_factorial(int nb);
      int main(void)
      {
          int res = ft_iterative_factorial(10);
          if (res != 3628800)
          {
              printf("ft_iterative_factorial(10) = %d, attendu 3628800\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "factorielle de 12 (plus grande valeur sans overflow sur un int)"
    # 12! = 479001600, qui rentre dans un int (max 2147483647).
    # 13! = 6227020800 depasse deja INT_MAX, on ne le teste donc pas
    # puisque le sujet dit explicitement que l'overflow n'est pas a gerer.
    main: |
      #include <stdio.h>
      int ft_iterative_factorial(int nb);
      int main(void)
      {
          int res = ft_iterative_factorial(12);
          if (res != 479001600)
          {
              printf("ft_iterative_factorial(12) = %d, attendu 479001600\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "argument invalide : -1 retourne 0"
    main: |
      #include <stdio.h>
      int ft_iterative_factorial(int nb);
      int main(void)
      {
          int res = ft_iterative_factorial(-1);
          if (res != 0)
          {
              printf("ft_iterative_factorial(-1) = %d, attendu 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "argument invalide : nombre negatif quelconque retourne 0"
    main: |
      #include <stdio.h>
      int ft_iterative_factorial(int nb);
      int main(void)
      {
          int res = ft_iterative_factorial(-42);
          if (res != 0)
          {
              printf("ft_iterative_factorial(-42) = %d, attendu 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "argument invalide : tres petit negatif (proche INT_MIN) ne plante pas"
    # Verifie qu'une boucle mal ecrite (ex: "while (nb != 0)") ne part pas
    # en boucle quasi infinie / crash sur un grand negatif.
    main: |
      #include <stdio.h>
      #include <limits.h>
      int ft_iterative_factorial(int nb);
      int main(void)
      {
          int res = ft_iterative_factorial(INT_MIN + 1);
          if (res != 0)
          {
              printf("ft_iterative_factorial(INT_MIN + 1) = %d, attendu 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
    check_memory: false