name: ft_print_comb
tags: ["piscine", "ex1"]

sources:
  - ft_print_comb.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "premiere combinaison et son format (012, 013)"
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <unistd.h>
      void ft_print_comb(void);

      int main(void)
      {
          int pipefd[2];
          pipe(pipefd);
          int saved = dup(STDOUT_FILENO);
          dup2(pipefd[1], STDOUT_FILENO);
          close(pipefd[1]);

          ft_print_comb();

          dup2(saved, STDOUT_FILENO);
          close(saved);

          char buffer[4096];
          size_t total = 0;
          ssize_t n;
          while ((n = read(pipefd[0], buffer + total, sizeof(buffer) - total - 1)) > 0)
              total += n;
          buffer[total] = '\0';
          close(pipefd[0]);

          if (strncmp(buffer, "012, 013", 8) != 0)
          {
              printf("Debut incorrect, obtenu : \"%.20s\"\n", buffer);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

