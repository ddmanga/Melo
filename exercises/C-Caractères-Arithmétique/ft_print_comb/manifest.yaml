          while ((n = read(pipefd[0], buffer + total, sizeof(buffer) - total - 1)) > 0)
              total += n;
          buffer[total] = '\0';
          close(pipefd[0]);

          if (buffer[0] < '0' || buffer[0] > '9' ||
              buffer[1] < '0' || buffer[1] > '9' ||
              buffer[2] < '0' || buffer[2] > '9' ||
