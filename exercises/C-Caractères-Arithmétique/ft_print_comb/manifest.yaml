  - name: "chiffres strictement croissants dans chaque combinaison (jamais 021, jamais 011)"
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <unistd.h>
      void ft_print_comb(void);

      int main(void)
      {
          int pipefd[2];
          pipe(pipefd);
          int saved = dup(STDOUT_FILENO);
          dup2(pipefd[1], STDOUT_FILENO);
          close(pipefd[1]);

          ft_print_comb();

          dup2(saved, STDOUT_FILENO);
          close(saved);

          char buffer[4096];
          size_t total = 0;
          ssize_t n;
          while ((n = read(pipefd[0], buffer + total, sizeof(buffer) - total - 1)) > 0)
              total += n;
          buffer[total] = '\0';
          close(pipefd[0]);

          for (size_t k = 0; k + 2 < total; k += 5)
          {
              if (buffer[k] < '0' || buffer[k] > '9')
                  break;
              int a = buffer[k] - '0';
              int b = buffer[k + 1] - '0';
              int c = buffer[k + 2] - '0';
              if (!(a < b && b < c))
              {
                  printf("Combinaison non croissante ou chiffre repete trouvee : %c%c%c\n",
                         buffer[k], buffer[k + 1], buffer[k + 2]);
                  return (1);
              }
          }
          return (0);
      }
    expected_exit: 0

