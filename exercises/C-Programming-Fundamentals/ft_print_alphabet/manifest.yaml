name: ft_print_alphabet
tags: ["piscine_c00", "exam_C_00"]

sources:
  - ft_print_alphabet.c

compile:
  compiler: cc
  flags: ["-Wall", "-Wextra", "-Werror"]
  extra: []

prelude: |
  void ft_print_alphabet(void);

tests:
  - name: "alphabet complet croissant"
    body: |
      ft_print_alphabet();
    expected_stdout: "abcdefghijklmnopqrstuvwxyz"
    expected_exit: 0