name: ft_split
tags: ["piscine_c00", "exam_C_00"]

sources:
  - ft_split.c

compile:
  compiler: cc
  flags: ["-Wall", "-Wextra", "-Werror"]
  extra: []

prelude: |
  #include <stdio.h>
  #include <stdlib.h>
  char **ft_split(char *str, char sep);

  static void free_split(char **res)
  {
      int i;

      i = 0;
      while (res[i])
      {
          free(res[i]);
          i++;
      }
      free(res);
  }

tests:
  - name: "mots separes par un espace simple"
    body: |
      char **res = ft_split("bonjour le monde", ' ');
      int i = 0;
      while (res[i])
      {
          printf("%s\n", res[i]);
          i++;
      }
      free_split(res);
    expected_stdout: "bonjour\nle\nmonde\n"
    expected_exit: 0
    check_memory: true

  - name: "separateurs consecutifs ignores"
    body: |
      char **res = ft_split("un   deux     trois", ' ');
      int i = 0;
      while (res[i])
      {
          printf("[%s]\n", res[i]);
          i++;
      }
      free_split(res);
    expected_stdout: "[un]\n[deux]\n[trois]\n"
    expected_exit: 0
    check_memory: true

  - name: "separateurs en debut et fin"
    body: |
      char **res = ft_split("   hello world   ", ' ');
      int i = 0;
      while (res[i])
      {
          printf("[%s]\n", res[i]);
          i++;
      }
      free_split(res);
    expected_stdout: "[hello]\n[world]\n"
    expected_exit: 0
    check_memory: true

  - name: "chaine uniquement composee de separateurs"
    body: |
      char **res = ft_split("     ", ' ');
      printf("%d\n", res[0] == NULL);
      free_split(res);
    expected_stdout: "1\n"
    expected_exit: 0
    check_memory: true

  - name: "chaine vide"
    body: |
      char **res = ft_split("", ' ');
      printf("%d\n", res[0] == NULL);
      free_split(res);
    expected_stdout: "1\n"
    expected_exit: 0
    check_memory: true

  - name: "aucun separateur present (un seul mot)"
    body: |
      char **res = ft_split("bonjour", ' ');
      int i = 0;
      while (res[i])
      {
          printf("%s\n", res[i]);
          i++;
      }
      printf("%d\n", res[1] == NULL);
      free_split(res);
    expected_stdout: "bonjour\n1\n"
    expected_exit: 0
    check_memory: true

  - name: "separateur different d'un espace"
    body: |
      char **res = ft_split("a,b,,c", ',');
      int i = 0;
      while (res[i])
      {
          printf("[%s]\n", res[i]);
          i++;
      }
      free_split(res);
    expected_stdout: "[a]\n[b]\n[c]\n"
    expected_exit: 0
    check_memory: true

  - name: "tableau bien termine par NULL (pas de lecture hors bornes)"
    body: |
      char **res = ft_split("x y z", ' ');
      int count = 0;
      while (res[count])
          count++;
      printf("%d %d\n", count, res[count] == NULL);
      free_split(res);
    expected_stdout: "3 1\n"
    expected_exit: 0
    check_memory: true