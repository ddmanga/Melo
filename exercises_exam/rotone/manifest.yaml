name: rotone
tags: ["piscine_c00", "exam_C_00"]
own_main: true

sources:
  - rotone.c

compile:
  compiler: cc
  flags: ["-Wall", "-Wextra", "-Werror"]
  extra: []

tests:
  - name: "mot simple minuscule"
    args: ["abc"]
    expected_stdout: "bcd\n"
    expected_exit: 0

  - name: "phrase avec ponctuation et casse mixte"
    args: ["Les stagiaires du staff ne sentent pas toujours tres bon."]
    expected_stdout: "Mft tubhjbjsft ev tubgg of tfoufou qbt upvkpvst usft cpo.\n"
    expected_exit: 0

  - name: "z et Z bouclent sur a et A, chiffres inchanges"
    args: ["AkjhZ zLKIJz , 23y "]
    expected_stdout: "BlkiA aMLJKa , 23z \n"
    expected_exit: 0

  - name: "aucun argument"
    args: []
    expected_stdout: "\n"
    expected_exit: 0

  - name: "chaine vide"
    args: [""]
    expected_stdout: "\n"
    expected_exit: 0

  - name: "deux arguments (pas 1 seul)"
    args: ["a", "b"]
    expected_stdout: "\n"
    expected_exit: 0