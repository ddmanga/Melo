name: ft_print_comb2
tags: ["piscine", "ex2"]

sources:
  - ft_print_comb2.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "premiere combinaison et son format (00 01, 00 02)"
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <unistd.h>
      void ft_print_comb2(void);

      int main(void)
      {
          int pipefd[2];
          pipe(pipefd);
          int saved = dup(STDOUT_FILENO);
          dup2(pipefd[1], STDOUT_FILENO);
          close(pipefd[1]);

          ft_print_comb2();

          dup2(saved, STDOUT_FILENO);
          close(saved);

          char buffer[64000];
          size_t total = 0;
          ssize_t n;
          while ((n = read(pipefd[0], buffer + total, sizeof(buffer) - total - 1)) > 0)
              total += n;
          buffer[total] = '\0';
          close(pipefd[0]);

          if (strncmp(buffer, "00 01, 00 02", 12) != 0)
          {
              printf("Debut incorrect, obtenu : \"%.20s\"\n", buffer);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "derniere combinaison et fin de ligne propre (98 99)"
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <unistd.h>
      void ft_print_comb2(void);

      int main(void)
      {
          int pipefd[2];
          pipe(pipefd);
          int saved = dup(STDOUT_FILENO);
          dup2(pipefd[1], STDOUT_FILENO);
          close(pipefd[1]);

          ft_print_comb2();

          dup2(saved, STDOUT_FILENO);
          close(saved);

          char buffer[64000];
          size_t total = 0;
          ssize_t n;
          while ((n = read(pipefd[0], buffer + total, sizeof(buffer) - total - 1)) > 0)
              total += n;
          buffer[total] = '\0';
          close(pipefd[0]);

          if (total < 6 || strcmp(buffer + total - 6, "98 99\n") != 0)
          {
              printf("Fin incorrecte, obtenu : \"%.20s\"\n",
                     buffer + (total > 20 ? total - 20 : 0));
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "nombre total de combinaisons (4950 paires, 4949 separateurs)"
    main: |
      #include <stdio.h>
      #include <unistd.h>
      void ft_print_comb2(void);

      int main(void)
      {
          int pipefd[2];
          pipe(pipefd);
          int saved = dup(STDOUT_FILENO);
          dup2(pipefd[1], STDOUT_FILENO);
          close(pipefd[1]);

          ft_print_comb2();

          dup2(saved, STDOUT_FILENO);
          close(saved);

          char buffer[64000];
          size_t total = 0;
          ssize_t n;
          while ((n = read(pipefd[0], buffer + total, sizeof(buffer) - total - 1)) > 0)
              total += n;
          buffer[total] = '\0';
          close(pipefd[0]);

          int count = 0;
          for (size_t k = 0; k + 1 < total; k++)
          {
              if (buffer[k] == ',' && buffer[k + 1] == ' ')
                  count++;
          }
          if (count != 4949)
          {
              printf("Nombre de separateurs incorrect : %d (attendu 4949)\n", count);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
