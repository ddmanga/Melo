name: ft_strdup
tags: ["piscine_c00", "exam_C_00"]

sources:
  - ft_strdup.c

compile:
  compiler: cc
  flags: ["-Wall", "-Wextra", "-Werror"]
  extra: []

prelude: |
  #include <stdio.h>
  #include <stdlib.h>
  #include <string.h>
  char *ft_strdup(const char *src);

tests:
  - name: "chaine simple"
    body: |
      char *s = ft_strdup("hello");
      printf("%s\n", s);
      free(s);
    expected_stdout: "hello\n"
    expected_exit: 0
    check_memory: true

  - name: "chaine vide"
    body: |
      char *s = ft_strdup("");
      printf("[%s]\n", s);
      free(s);
    expected_stdout: "[]\n"
    expected_exit: 0
    check_memory: true

  - name: "NULL en entree"
    body: |
      char *s = ft_strdup(NULL);
      printf("%p\n", (void *)s);
    expected_stdout: "(nil)\n"
    expected_exit: 0
    check_memory: true

  - name: "vraie copie (pas un alias du pointeur source)"
    body: |
      char original[] = "hello";
      char *s = ft_strdup(original);
      s[0] = 'H';
      printf("%s %s\n", original, s);
      free(s);
    expected_stdout: "hello Hello\n"
    expected_exit: 0
    check_memory: true

  - name: "taille allouee exacte (pas de depassement)"
    body: |
      char *s = ft_strdup("ab");
      size_t len = strlen(s);
      printf("%zu\n", len);
      s[len] = 'X';
      free(s);
    expected_stdout: "2\n"
    expected_exit: 0
    check_memory: true

  - name: "chaine longue (grosse allocation)"
    body: |
      char big[2001];
      size_t i = 0;
      while (i < 2000)
      {
          big[i] = 'a' + (i % 26);
          i++;
      }
      big[2000] = '\0';
      char *s = ft_strdup(big);
      printf("%d %zu\n", strcmp(big, s), strlen(s));
      free(s);
    expected_stdout: "0 2000\n"
    expected_exit: 0
    check_memory: true

  - name: "caracteres speciaux"
    body: |
      char *s = ft_strdup("a b\t1 !@# ZZ");
      printf("%s\n", s);
      free(s);
    expected_stdout: "a b\t1 !@# ZZ\n"
    expected_exit: 0
    check_memory: true