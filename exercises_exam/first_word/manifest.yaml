name: first_word
tags: ["piscine_c00", "exam_C_00"]
own_main: true

sources:
  - first_word.c

compile:
  compiler: cc
  flags: ["-Wall", "-Wextra", "-Werror"]
  extra: []

tests:
  - name: "mot simple avec un seul espace"
    args: ["FOR PONY"]
    expected_stdout: "FOR\n"
    expected_exit: 0

  - name: "espaces multiples entre les mots"
    args: ["this        ...       is sparta, then again, maybe    not"]
    expected_stdout: "this\n"
    expected_exit: 0

  - name: "que des espaces (aucun mot)"
    args: ["   "]
    expected_stdout: "\n"
    expected_exit: 0

  - name: "deux parametres (pas 1 seul)"
    args: ["a", "b"]
    expected_stdout: "\n"
    expected_exit: 0

  - name: "aucun parametre"
    args: []
    expected_stdout: "\n"
    expected_exit: 0

  - name: "espaces en debut et fin, virgule dans le mot"
    args: ["  lorem,ipsum  "]
    expected_stdout: "lorem,ipsum\n"
    expected_exit: 0

  - name: "tabulations comme separateur"
    args: ["\thello\tworld"]
    expected_stdout: "hello\n"
    expected_exit: 0

  - name: "chaine vide"
    args: [""]
    expected_stdout: "\n"
    expected_exit: 0