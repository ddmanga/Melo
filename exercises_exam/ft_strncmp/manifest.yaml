name: ft_strncmp
tags: ["piscine_c00", "exam_C_00"]

sources:
  - ft_strncmp.c

compile:
  compiler: cc
  flags: ["-Wall", "-Wextra", "-Werror"]
  extra: []

prelude: |
  #include <stdio.h>
  int ft_strncmp(char *s1, char *s2, unsigned int n);

  static void print_sign(int n)
  {
      if (n == 0)
          printf("0\n");
      else if (n < 0)
          printf("negatif\n");
      else
          printf("positif\n");
  }

tests:
  - name: "chaines identiques sur toute la longueur"
    body: |
      print_sign(ft_strncmp("abc", "abc", 3));
    expected_stdout: "0\n"
    expected_exit: 0

  - name: "differentes mais identiques sur n limite"
    body: |
      print_sign(ft_strncmp("abc", "abd", 2));
    expected_stdout: "0\n"
    expected_exit: 0

  - name: "difference dans la limite n"
    body: |
      print_sign(ft_strncmp("abc", "abd", 3));
    expected_stdout: "negatif\n"
    expected_exit: 0

  - name: "n vaut 0 (toujours egal)"
    body: |
      print_sign(ft_strncmp("abc", "xyz", 0));
    expected_stdout: "0\n"
    expected_exit: 0

  - name: "n plus grand que les deux chaines, chaines identiques"
    body: |
      print_sign(ft_strncmp("abc", "abc", 100));
    expected_stdout: "0\n"
    expected_exit: 0

  - name: "s1 plus courte que n, prefixe de s2"
    body: |
      print_sign(ft_strncmp("abc", "abcdef", 10));
    expected_stdout: "negatif\n"
    expected_exit: 0

  - name: "chaines vides"
    body: |
      print_sign(ft_strncmp("", "", 5));
    expected_stdout: "0\n"
    expected_exit: 0

  - name: "s1 vide, s2 non vide, n non nul"
    body: |
      print_sign(ft_strncmp("", "a", 5));
    expected_stdout: "negatif\n"
    expected_exit: 0