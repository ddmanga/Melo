name: inter
tags: ["piscine_c00", "exam_C_00"]
own_main: true

sources:
  - inter.c

compile:
  compiler: cc
  flags: ["-Wall", "-Wextra", "-Werror"]
  extra: []

tests:
  - name: "caracteres communs simples"
    args: ["abcde", "aeiouy"]
    expected_stdout: "a\ne\n"
    expected_exit: 0

  - name: "aucun caractere commun"
    args: ["abc", "xyz"]
    expected_stdout: ""
    expected_exit: 0

  - name: "doublons dans la premiere chaine ignores"
    args: ["aabbcc", "abc"]
    expected_stdout: "a\nb\nc\n"
    expected_exit: 0

  - name: "deux chaines vides"
    args: ["", ""]
    expected_stdout: ""
    expected_exit: 0

  - name: "pas assez d'arguments"
    args: ["abc"]
    expected_stdout: "\n"
    expected_exit: 0

  - name: "aucun argument"
    args: []
    expected_stdout: "\n"
    expected_exit: 0